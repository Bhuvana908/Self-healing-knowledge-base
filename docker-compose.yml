# Stack adaptation: the platform's managed stack is MongoDB (not PostgreSQL), so this
# compose ships app + mongo. Every behavior from the SRS is preserved — see README.md
# ("Stack adaptations") and docs/SRS.md.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: app
      # REQUIRED — no default is shipped. Generate: python -c "import secrets; print(secrets.token_hex(32))"
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in your environment or .env file}
      # Optional: enables the label-only Gemini judge (temperature 0, JSON) + embeddings
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ORIGINS: "*"
    ports:
      - "8001:8001"

volumes:
  mongo-data:
