name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: ci
      # CI-only signing secret (not one of the refused defaults, long enough)
      SECRET_KEY: ci-signing-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Start API
        working-directory: backend
        run: |
          python -m uvicorn server:app --host 0.0.0.0 --port 8001 &
          for i in $(seq 30); do curl -sf http://localhost:8001/api/ >/dev/null && break; sleep 1; done
      - name: Run backend tests
        working-directory: backend
        run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Frontend typecheck
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile
          yarn typecheck

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t self-healing-kb .
      - name: Smoke the image (refuses to start without SECRET_KEY)
        run: |
          set +e
          docker run --rm -e MONGO_URL=mongodb://host.docker.internal:27017 -p 8001:8001 self-healing-kb &
          sleep 8
          if curl -sf http://localhost:8001/api/ >/dev/null 2>&1; then
            echo "server started WITHOUT SECRET_KEY — refusing secrets defaults failed"; exit 1
          fi
          echo "server correctly refused to start without SECRET_KEY"
